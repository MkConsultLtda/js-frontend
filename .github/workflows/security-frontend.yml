name: Frontend Security

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL pública para DAST (opcional)"
        required: false
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  sast-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten

      - name: TruffleHog (secret scanning)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  dependency-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (prod deps)
        run: npm audit --omit=dev --audit-level=high

      # Pin + install com retry: @master/setup flaky (curl exit 35 / SSL) e risco de supply-chain.
      - name: Install Trivy
        env:
          TRIVY_VERSION: v0.70.0
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
              | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"; then
              trivy --version
              exit 0
            fi
            echo "Trivy install attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to install Trivy after retries"
          exit 1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  dependency-scan-strict:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (prod deps strict)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Install Trivy
        env:
          TRIVY_VERSION: v0.70.0
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
              | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"; then
              trivy --version
              exit 0
            fi
            echo "Trivy install attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to install Trivy after retries"
          exit 1

      - name: Trivy filesystem scan (strict)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL

  dast-zap:
    if: github.event_name == 'workflow_dispatch' && inputs.target_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.target_url }}
